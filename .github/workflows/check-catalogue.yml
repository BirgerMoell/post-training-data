name: Check catalogue

on:
  pull_request:
  push:
    branches: [main]

jobs:
  catalogue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/build_indexes.py --check

